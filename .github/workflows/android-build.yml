name: Lonca Core Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu çek
        uses: actions/checkout@v4

      - name: Java kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Sabit imzalama anahtarını yükle (güncellemede veri kaybolmasın diye)
        run: |
          mkdir -p ~/.android
          cp keystore/debug.keystore ~/.android/debug.keystore

      - name: İmza parmak izini göster (teşhis — her derlemede aynı olmalı)
        run: |
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey | grep -A1 "SHA256:"

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Derle (debug APK)
        run: gradle :app:assembleDebug --no-daemon

      - name: APK'yı yükle (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: lonca-core-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
